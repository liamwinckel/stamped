<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stamped">
<meta name="theme-color" content="#0F2A5C">
<title>Stamped</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=DM+Mono:wght@400;500&family=DM+Serif+Display&family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
html[data-theme=classic]{--frame:#0F2A5C;--frame-ink:#FFFFFF;--frame-muted:#C9D6EE;--eyebrow:#E9A92B;--page:#F3F6FB;--page-line:#DCE5F3;--ink:#0F2A5C;--muted:#5B6B85;--surface:#FFFFFF;--surface-2:#EEF4FC;--line:#D5E2F5;--accent:#E9A92B;--accent-ink:#0F2A5C;--accent-text:#8A5A00;--head:'Sora',sans-serif;--mono:'Courier Prime',monospace;--r:18px;--r-sm:12px;--btn-r:16px;--cover:#16336E;--cover-ink:#E9A92B;--shadow:0 14px 34px rgba(5,15,40,.35)}
html[data-theme=vintage]{--frame:#3B2A20;--frame-ink:#F1E6D2;--frame-muted:#D9C7A8;--eyebrow:#E2B86B;--page:#F1E6D2;--page-line:#E2D3B8;--ink:#3B2A20;--muted:#6B5640;--surface:#F7EEDD;--surface-2:#EADCC2;--line:#D8C6A6;--accent:#A8352A;--accent-ink:#F7EEDD;--accent-text:#A8352A;--head:'DM Serif Display',serif;--mono:'Special Elite',monospace;--r:8px;--r-sm:6px;--btn-r:6px;--cover:#5A3E2B;--cover-ink:#E2B86B;--shadow:0 14px 34px rgba(20,10,5,.5)}
html[data-theme=night]{--frame:#0A1428;--frame-ink:#F2F5FB;--frame-muted:#AFC0DE;--eyebrow:#E9B949;--page:#12213F;--page-line:#22355C;--ink:#F2F5FB;--muted:#AFC0DE;--surface:#12213F;--surface-2:#1A2C50;--line:#2A4170;--accent:#E9B949;--accent-ink:#0A1428;--accent-text:#E9B949;--head:'Space Grotesk',sans-serif;--mono:'DM Mono',monospace;--r:22px;--r-sm:14px;--btn-r:30px;--cover:#0E1B36;--cover-ink:#E9B949;--shadow:0 14px 40px rgba(0,0,0,.55)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--frame);color:var(--frame-ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .6s var(--ease),color .6s var(--ease);overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 104px)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-size:22px;font-weight:700;letter-spacing:-.3px}
.brand svg{width:30px;height:30px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid color-mix(in srgb,var(--frame-ink) 28%,transparent);background:transparent;display:grid;place-items:center;transition:transform .2s var(--ease),background .3s}
.icon-btn:active{transform:scale(.92)}
.view{display:none}
html.book-mode,html.book-mode body{height:100%;overflow:hidden;overscroll-behavior:none}
html.book-mode .app{height:100dvh;display:flex;flex-direction:column}
html.book-mode main{flex:1;min-height:0;display:flex;flex-direction:column}
html.book-mode #view-book.active{display:flex;flex-direction:column;flex:1;min-height:0}
html.book-mode .viewport{flex:1;height:auto;min-height:0}
.icon-btn{position:relative}
.icon-btn.due::after{content:'';position:absolute;top:5px;right:5px;width:11px;height:11px;border-radius:50%;background:var(--eyebrow);box-shadow:0 0 0 2px var(--frame);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.share-img{width:100%;border-radius:var(--r-sm);display:block;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);-webkit-touch-callout:default}
.view.active{display:block;animation:viewIn .5s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--eyebrow)}
.h1{font-family:var(--head);font-size:28px;font-weight:700;margin:4px 0 0;letter-spacing:-.4px;line-height:1.1}
html[data-theme=vintage] .h1{font-weight:400}
.muted{color:var(--frame-muted)}
/* Book */
.book-meta{display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px 12px;gap:12px}
.book-count{text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--frame-muted);line-height:1.5}
.viewport{position:relative;height:min(66dvh,590px);min-height:320px;touch-action:none;perspective:2200px;perspective-origin:20% 50%;overflow:hidden;border-radius:var(--r)}
.track{position:relative;height:100%;transform-style:preserve-3d}
.leaf{position:absolute;inset:0;display:none;transform-origin:left center;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;will-change:transform;transform:rotateY(0deg)}
.leaf.leaving{display:block;z-index:0}
.leaf.current,.leaf.under,.leaf.turning{display:block}
.leaf.current{z-index:2}.leaf.under{z-index:1}.leaf.turning{z-index:3}
.leaf>.page{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf>.back{position:absolute;inset:0;border-radius:var(--r);background:var(--page);transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.leaf>.back::after{content:'';position:absolute;inset:0;background:linear-gradient(270deg,rgba(0,0,0,.2),rgba(0,0,0,0) 40%)}
.leaf>.page:not(.cover)::after{content:'';position:absolute;left:0;top:0;bottom:0;width:22px;background:linear-gradient(90deg,rgba(0,0,0,.12),rgba(0,0,0,0));pointer-events:none}
.shade{position:absolute;inset:0;pointer-events:none;background:#000;opacity:0;z-index:6}
.curl{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:6;background:linear-gradient(90deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.08) 70%,rgba(255,255,255,.18) 88%,rgba(0,0,0,.28) 100%)}
.page{position:relative;height:100%;border-radius:var(--r);background:var(--page);color:var(--ink);overflow:hidden;box-shadow:var(--shadow);transition:background-color .6s var(--ease)}
.page.thunk{animation:thunk .4s ease .38s}
@keyframes thunk{0%,100%{transform:none}35%{transform:translateY(3px) scale(.994)}65%{transform:translateY(-1px)}}
.decor{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.page-no{position:absolute;bottom:12px;right:16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.stamp{position:absolute;left:var(--x);top:var(--y);width:52%;aspect-ratio:1;padding:0;border:0;background:none;transform:translate(-50%,-50%) rotate(var(--rot));border-radius:50%;transition:transform .35s var(--ease)}
.stamp svg{width:100%;height:100%;overflow:visible;display:block}
.stamp:active{transform:translate(-50%,-50%) rotate(var(--rot)) scale(.96)}
.stamp:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.stamp.landing{animation:land .8s var(--ease) both}
.stamp.landing::after{content:'';position:absolute;inset:12%;border-radius:50%;border:3px solid currentColor;opacity:0;animation:splat .7s ease-out .36s}
@keyframes land{0%{opacity:0;transform:translate(-50%,-50%) rotate(calc(var(--rot) + 14deg)) scale(2.1);filter:blur(5px)}52%{opacity:1;transform:translate(-50%,-50%) rotate(var(--rot)) scale(.9);filter:blur(0)}72%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.04)}100%{opacity:1;transform:translate(-50%,-50%) rotate(var(--rot)) scale(1)}}
@keyframes splat{0%{opacity:.5;transform:scale(.7)}100%{opacity:0;transform:scale(1.5)}}
.stamp.fade{animation:fadeIn .6s var(--ease) both}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) scale(.94)}to{opacity:1}}
.slot-empty{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:44%;aspect-ratio:1.3;border:2px dashed color-mix(in srgb,var(--muted) 55%,transparent);border-radius:var(--r);display:grid;place-items:center;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px;background:none;padding:8px}
.empty-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center}
.empty-state h2{font-family:var(--head);font-size:24px;margin:0}
.empty-state p{margin:0;color:var(--muted);line-height:1.5}
.cover{background:var(--cover);color:var(--cover-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.cover::before{content:'';position:absolute;inset:14px;border:1.5px solid color-mix(in srgb,var(--cover-ink) 45%,transparent);border-radius:calc(var(--r) - 6px);pointer-events:none}
.cover-emblem{width:42%;aspect-ratio:1}
.cover-title{font-family:var(--head);font-size:34px;letter-spacing:8px;font-weight:700}
html[data-theme=vintage] .cover-title{font-weight:400;letter-spacing:5px}
.cover-sub{font-family:var(--mono);font-size:14px;letter-spacing:2px;text-transform:uppercase;opacity:.9}
.cover-meta{font-family:var(--mono);font-size:12px;opacity:.75;margin-top:6px}
.cover-hint{position:absolute;bottom:26px;font-size:12px;opacity:.7;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 0}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:70%}
.dot{width:7px;height:7px;border-radius:4px;background:color-mix(in srgb,var(--frame-ink) 30%,transparent);transition:width .35s var(--ease),background .35s}
.dot.on{width:20px;background:var(--eyebrow)}
.nudge-card{margin-top:14px;display:flex;gap:12px;align-items:center;background:var(--surface);color:var(--ink);border-radius:var(--r);padding:14px 16px;animation:viewIn .5s var(--ease) both}
.nudge-card p{margin:0;font-size:14px;line-height:1.4;flex:1}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--btn-r);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;transition:transform .2s var(--ease),filter .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.btn.danger{color:#B3261E;border-color:#E7B8B4}
html[data-theme=night] .btn.danger{color:#FFB4AB;border-color:#6B3A3A}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
/* Nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:color-mix(in srgb,var(--frame) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid color-mix(in srgb,var(--frame-ink) 12%,transparent)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--frame-muted);font-size:11px;font-weight:600;min-height:48px;justify-content:center;transition:color .3s}
.tab svg{width:24px;height:24px;transition:transform .35s var(--spring)}
.tab.active{color:var(--eyebrow)}
.tab.active svg{transform:translateY(-2px) scale(1.08)}
.add-btn{justify-self:center;width:62px;height:62px;margin-top:-26px;border-radius:50%;border:4px solid var(--frame);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.3);transition:transform .25s var(--spring)}
.add-btn:active{transform:scale(.9) rotate(-8deg)}
.add-btn svg{width:28px;height:28px}
/* Sheets */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(3,8,20,.5);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:480px;margin:0 auto;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);color:var(--ink);border-radius:26px 26px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(105%);transition:transform .55s var(--ease);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
html[data-theme=vintage] .sheet{border-radius:14px 14px 0 0}
.sheet.open{transform:none}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:var(--head);font-size:24px;margin:0 0 4px}
html[data-theme=vintage] .sheet h2{font-weight:400}
.sheet-sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.preview{display:flex;justify-content:center;margin:4px 0 14px}
.preview .pv{width:170px;height:170px;transition:transform .4s var(--ease)}
.preview .pv svg{width:100%;height:100%;overflow:visible}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;position:relative}
.field label,.label{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;min-height:48px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);padding:12px 14px;font-size:16px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
textarea.input{min-height:76px;resize:vertical}
.row{display:flex;gap:10px}
.row>*{flex:1}
.suggest{position:absolute;top:100%;left:0;right:0;z-index:5;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:0 12px 30px rgba(0,0,0,.18);overflow:hidden;display:none}
.suggest.open{display:block;animation:viewIn .25s var(--ease)}
.suggest button{display:flex;justify-content:space-between;width:100%;min-height:46px;padding:10px 14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--ink)}
.suggest button:last-child{border-bottom:0}
.suggest small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:14px;font-weight:500;transition:all .25s var(--ease)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.loc-btn{width:100%;margin-bottom:14px}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-thumb{width:64px;height:64px;border-radius:var(--r-sm);object-fit:cover;background:var(--surface-2);border:1px solid var(--line)}
.file-label{position:relative;overflow:hidden}
.file-label input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* Detail */
.detail-stamp{width:240px;height:240px;margin:6px auto 10px}
.detail-stamp svg{width:100%;height:100%;overflow:visible}
.detail-stamp.pop{animation:pop .6s var(--spring) both}
@keyframes pop{from{opacity:0;transform:scale(.7) rotate(-8deg)}to{opacity:1;transform:none}}
.detail-title{font-family:var(--head);font-size:28px;margin:0;text-align:center}
html[data-theme=vintage] .detail-title{font-weight:400}
.detail-sub{text-align:center;color:var(--muted);margin:4px 0 16px;font-size:15px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.fact{background:var(--surface-2);border-radius:var(--r-sm);padding:12px}
.fact b{display:block;font-size:15px}
.fact span{font-size:12px;color:var(--muted)}
.note{background:var(--surface-2);border-radius:var(--r-sm);padding:14px;font-size:15px;line-height:1.5;margin-bottom:14px;white-space:pre-wrap}
.detail-photo{width:100%;border-radius:var(--r-sm);margin-bottom:14px;display:block}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
/* Cards / stats */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);color:var(--ink);border-radius:var(--r);padding:18px;transition:background-color .6s var(--ease)}
.card h3{font-family:var(--head);font-size:18px;margin:0 0 12px}
html[data-theme=vintage] .card h3{font-weight:400;font-size:20px}
.hero{position:relative;overflow:hidden}
.hero .big{font-family:var(--head);font-size:64px;font-weight:700;line-height:1;letter-spacing:-2px;margin:6px 0}
html[data-theme=vintage] .hero .big{font-weight:400}
.hero p{margin:0 0 14px;color:var(--muted);line-height:1.5;font-size:15px}
.hero .eyebrow{color:var(--accent-text)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface-2);border-radius:var(--r-sm);padding:14px;animation:viewIn .5s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
.tile .num{font-family:var(--head);font-size:30px;font-weight:700;line-height:1.1}
html[data-theme=vintage] .tile .num{font-weight:400}
.tile .lbl{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile .sub{font-size:12px;color:var(--muted);margin-top:4px}
.year-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.year-chips::-webkit-scrollbar{display:none}
.ychip{flex:0 0 auto;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid color-mix(in srgb,var(--frame-ink) 28%,transparent);background:transparent;color:var(--frame-ink);font-weight:600;transition:all .3s var(--ease)}
.ychip[aria-pressed=true]{background:var(--eyebrow);color:var(--frame);border-color:transparent}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;align-items:end;height:120px}
.mcol{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;border-radius:6px 6px 3px 3px;background:var(--line);transform-origin:bottom;animation:grow .9s var(--ease) both;animation-delay:calc(var(--i)*45ms);min-height:4px}
.bar.hot{background:var(--accent)}
.bar.has{background:color-mix(in srgb,var(--ink) 55%,var(--surface))}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.mlabel{font-size:11px;color:var(--muted);font-weight:600}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mini{aspect-ratio:1;border:0;background:var(--page);border-radius:var(--r-sm);padding:6px;transition:transform .2s var(--ease)}
.mini:active{transform:scale(.95)}
.mini svg{width:100%;height:100%;overflow:visible}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}
.list-row b{font-weight:600;font-size:15px}
.list-row small{display:block;color:var(--muted);font-size:12.5px}
.flag{display:flex;width:30px;height:20px;border-radius:4px;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 1px var(--line)}
.flag i{flex:1}
.count-pill{font-family:var(--mono);font-size:13px;background:var(--surface-2);border-radius:999px;padding:4px 10px}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px;transform-origin:left;animation:growX 1s var(--ease) both}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hbar-row{display:grid;grid-template-columns:44px 1fr 28px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.hbar{height:14px;border-radius:7px;background:var(--accent);transform-origin:left;animation:growX .9s var(--ease) both}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 6px;border-radius:var(--r-sm);background:var(--surface-2);animation:viewIn .5s var(--ease) both;animation-delay:calc(var(--i)*40ms)}
.badge svg{width:52px;height:52px}
.badge b{font-size:12.5px;line-height:1.2}
.badge small{font-size:11px;color:var(--muted);line-height:1.3}
.badge.locked{opacity:.55}
/* Settings */
.theme-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.theme-opt{border:2px solid var(--line);border-radius:var(--r-sm);padding:8px 6px 10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);transition:border-color .3s,transform .25s var(--ease)}
.theme-opt[aria-pressed=true]{border-color:var(--accent);transform:translateY(-2px)}
.theme-opt .sw{width:100%;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;padding:6px}
.theme-opt .sw svg{width:100%;height:100%;overflow:visible}
.theme-opt b{font-size:12.5px}
.switch-row{display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:12px}
.switch{position:relative;width:52px;height:32px;flex-shrink:0}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:16px;background:var(--line);transition:background .3s}
.switch span::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(20px)}
.help{font-size:13.5px;color:var(--muted);line-height:1.5;margin:0 0 12px}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Replay */
.replay{position:fixed;inset:0;z-index:60;background:var(--frame);color:var(--frame-ink);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 20px);opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.replay.open{opacity:1;pointer-events:auto}
.replay-head{text-align:center;margin-bottom:12px}
.replay-year{font-family:var(--head);font-size:56px;font-weight:700;line-height:1;letter-spacing:-1px}
.replay-month{font-family:var(--mono);letter-spacing:3px;text-transform:uppercase;color:var(--eyebrow);height:20px;margin-top:8px;transition:opacity .25s}
.replay-grid{flex:1;width:100%;max-width:440px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-content:center;gap:4px;overflow:hidden}
.replay-grid .rs{aspect-ratio:1;position:relative}
.replay-grid .rs .stamp{width:100%;left:50%;top:50%}
.replay-sum{text-align:center;opacity:0;transform:translateY(14px);transition:all .6s var(--ease);margin:10px 0 14px;font-size:17px;line-height:1.5}
.replay-sum.show{opacity:1;transform:none}
.replay-sum b{font-family:var(--head);font-size:22px;display:block}
.replay-actions{display:flex;gap:10px;width:100%;max-width:440px}
.replay-actions .btn{flex:1}
/* Toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);z-index:70;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;font-size:14px;max-width:min(92vw,420px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:all .4s var(--ease);pointer-events:none}
html[data-theme=night] .toast{background:#F2F5FB;color:#0A1428}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

const $ = (s, el=document) => el.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function hash(str){ let h = 2166136261 >>> 0; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (arr, r) => arr[Math.floor(r() * arr.length) % arr.length];
function hexRgb(h){ h = h.replace('#',''); return [0,2,4].map(i => parseInt(h.slice(i,i+2),16)); }
function rgbHex(c){ return '#' + c.map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join(''); }
function mix(a,b,t){ const A = hexRgb(a), B = hexRgb(b); return rgbHex(A.map((v,i) => v + (B[i]-v)*t)); }
function lum(h){ const [r,g,b] = hexRgb(h).map(v => { v/=255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }); return .2126*r + .7152*g + .0722*b; }
function km(a,b){ if (a==null||b==null||a.lat==null||b.lat==null) return null; const R=6371, toR=Math.PI/180; const dLat=(b.lat-a.lat)*toR, dLon=(b.lon-a.lon)*toR; const x=Math.sin(dLat/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
const fmtNum = n => Math.round(n).toLocaleString('en-CA');
function todayISO(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parts(iso){ const [y,m,d] = iso.split('-').map(Number); return {y,m,d}; }
function roman(n){ return ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'][n-1] || ''; }
function fmtStampDate(iso, theme){ const {y,m,d} = parts(iso); if (theme==='night') return `${String(d).padStart(2,'0')}.${String(m).padStart(2,'0')}.${String(y).slice(2)}`; if (theme==='vintage') return `${d} · ${roman(m)} · ${y}`; return `${d} ${MON[m-1]} ${y}`; }
function fmtLong(iso){ const {y,m,d} = parts(iso); return `${MONTH_LONG[m-1]} ${d}, ${y}`; }
const countryName = cc => COUNTRIES[cc] ? COUNTRIES[cc][0] : '';
const countryCols = cc => COUNTRIES[cc] ? COUNTRIES[cc].slice(2) : [];
const continentOf = cc => COUNTRIES[cc] ? COUNTRIES[cc][1] : null;
const cityByName = n => CITIES.find(c => norm(c.name) === norm(n));
function nearestCity(lat, lon){ let best=null, bd=Infinity; for (const c of CITIES){ const d = km({lat,lon}, c); if (d < bd){ bd=d; best=c; } } return {city:best, dist:bd}; }
function searchCities(q, n=6){ q = norm(q); if (!q) return []; const starts=[], has=[]; for (const c of CITIES){ const nm = norm(c.name); if (nm.startsWith(q)) starts.push(c); else if (nm.includes(q) || norm(countryName(c.cc)).startsWith(q)) has.push(c); } return starts.concat(has).slice(0,n); }

/* ---------- Storage ---------- */
const KEY = 'stamped.v1';
const DEFAULTS = {name:'', home:'Toronto', theme:'classic', sound:true, haptics:true, lastBackup:null, stampsAtBackup:0};
function loadState(){ try { const raw = localStorage.getItem(KEY); if (raw){ const s = JSON.parse(raw); if (s && Array.isArray(s.stamps)) return s; } } catch(e){} return null; }
let state = loadState() || {stamps:[], settings:{}};
state.settings = Object.assign({}, DEFAULTS, state.settings || {});
let storageOK = true;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; } catch(e){ storageOK = false; } scheduleBackupCache(); }
let backupCache = null, cacheTimer = null;
function scheduleBackupCache(){ backupCache = null; clearTimeout(cacheTimer); cacheTimer = setTimeout(() => { if (typeof buildBackup === 'function') buildBackup().then(t => { backupCache = t; }); }, 250); }

const memPhotos = new Map();
let dbp = null;
function db(){ if (dbp) return dbp; dbp = new Promise(res => { try { const r = indexedDB.open('stamped', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null); } catch(e){ res(null); } }); return dbp; }
async function putPhoto(id, data){ memPhotos.set(id, data); const d = await db(); if (!d) return; try { await new Promise((res, rej) => { const t = d.transaction('photos','readwrite'); t.objectStore('photos').put(data, id); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch(e){} }
async function getPhoto(id){ if (memPhotos.has(id)) return memPhotos.get(id); const d = await db(); if (!d) return null; try { return await new Promise(res => { const r = d.transaction('photos').objectStore('photos').get(id); r.onsuccess = () => { if (r.result) memPhotos.set(id, r.result); res(r.result || null); }; r.onerror = () => res(null); }); } catch(e){ return null; } }
async function delPhoto(id){ memPhotos.delete(id); const d = await db(); if (!d) return; try { d.transaction('photos','readwrite').objectStore('photos').delete(id); } catch(e){} }
async function clearPhotos(){ memPhotos.clear(); const d = await db(); if (!d) return; try { d.transaction('photos','readwrite').objectStore('photos').clear(); } catch(e){} }

/* ---------- Feedback ---------- */
let actx = null;
function unlockAudio(){ if (!state.settings.sound) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){} }
function thunk(vol=1){
  if (!state.settings.sound || !actx) return;
  try {
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t+.2);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.55*vol, t+.008); g.gain.exponentialRampToValueAtTime(.0001, t+.28);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.32);
    const len = Math.floor(actx.sampleRate*.07), buf = actx.createBuffer(1, len, actx.sampleRate), ch = buf.getChannelData(0);
    for (let i=0;i<len;i++) ch[i] = (Math.random()*2-1) * Math.pow(1-i/len, 3);
    const n = actx.createBufferSource(); n.buffer = buf; const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 1400;
    const g2 = actx.createGain(); g2.gain.value = .3*vol; n.connect(f).connect(g2).connect(actx.destination); n.start(t);
  } catch(e){}
}
function rustle(){
  if (!state.settings.sound || !actx) return;
  try { const t = actx.currentTime, len = Math.floor(actx.sampleRate*.32), buf = actx.createBuffer(1, len, actx.sampleRate), ch = buf.getChannelData(0);
    for (let i=0;i<len;i++){ const x = i/len; ch[i] = (Math.random()*2-1) * Math.sin(Math.PI*x) * (.6 + .4*Math.sin(x*40)); }
    const n = actx.createBufferSource(); n.buffer = buf; const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = .7;
    const g = actx.createGain(); g.gain.value = .09; n.connect(f).connect(g).connect(actx.destination); n.start(t);
  } catch(e){}
}
function buzz(ms=18){ if (state.settings.haptics && navigator.vibrate){ try { navigator.vibrate(ms); } catch(e){} } }
let toastTimer = null;
function toast(msg, ms=2800){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms); }

function seedOf(s){ return hash(norm(s.place) + '|' + s.date); }
function fit(text, maxW, base, ls, cw){ const n = Math.max(1, text.length); const fs = (maxW / n - ls) / cw; return Math.max(7, Math.min(base, fs)); }
function iconFor(s, r){
  if (s.lm && s.kind === s.lmKind && ICONS[s.lm]) return ICONS[s.lm];
  if (s.kind && s.kind !== 'city' && ICONS[s.kind]) return ICONS[s.kind];
  // procedural skyline
  let x = -30, d = 'M-30 22', tallest = {h:0, x:0, w:0};
  while (x < 30){ const w = Math.min(5 + Math.floor(r()*6), 30-x); const h = 8 + Math.floor(r()*30); d += ` V${22-h} H${x+w}`; if (h > tallest.h) tallest = {h, x, w}; x += w; }
  d += ' V22 Z';
  const cx = tallest.x + tallest.w/2, top = 22 - tallest.h;
  const feature = r() < .5 ? `<path d="M${cx} ${top}V${top-9}"/>` : `<path d="M${tallest.x} ${top}Q${cx} ${top-9} ${tallest.x+tallest.w} ${top}"/>`;
  let windows = ''; for (let i=0;i<5;i++){ const wx = -26 + Math.floor(r()*52), wy = 6 + Math.floor(r()*12); windows += `M${wx} ${wy}h2`; }
  return `<path d="${d}"/>${feature}<path d="${windows}"/><path d="M-34 22H34"/>`;
}
function inkFor(s, theme, r){
  if (theme === 'night') return pick(['#E9B949','#9CC3FF','#F4D9A6'], r);
  const strong = countryCols(s.cc).filter(h => { const L = lum(h); return L > .01 && L < .45; });
  const base = strong.length ? pick(strong, r) : pick(FALLBACK_INKS, r);
  if (theme === 'vintage') return mix(base, '#4A3426', .42);
  let ink = mix(base, '#0F2A5C', .16); if (lum(ink) > .22) ink = mix(ink, '#0F2A5C', .35); return ink;
}

sheet.addEventListener('touchend', () => { if (!sheetDrag) return; const dy = sheetDrag.dy; sheetDrag = null; sheet.style.transition = ''; sheet.style.transform = ''; if (dy > 120) closeSheet(); });

/* ---------- Editor ---------- */
let draft = null;
function openEditor(existing){
  unlockAudio();
  const s = existing;
  draft = s ? Object.assign({}, s, {photo:null, photoChanged:false, kindTouched:true}) : {place:'', cc:'', lat:null, lon:null, kind:'city', lm:null, lmKind:null, date:todayISO(), note:'', with:'', photo:null, photoChanged:false, kindTouched:false, hasPhoto:false};
  const countryOpts = Object.entries(COUNTRIES).sort((a,b) => a[1][0].localeCompare(b[1][0])).map(([cc,c]) => `<option value="${cc}">${esc(c[0])}</option>`).join('');
  openSheet(`
    <h2 id="sheetTitle">${s ? 'Edit stamp' : 'New stamp'}</h2>
    <p class="sheet-sub">${s ? 'Change anything — the stamp redraws as you go.' : 'For a trip you\'re on now, or one from years ago.'}</p>
    <div class="preview"><div class="pv" id="pv"></div></div>
    <button class="btn block loc-btn" id="locBtn" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Use my location</button>
    <div class="field"><label for="fPlace">Place</label><input class="input" id="fPlace" autocomplete="off" placeholder="City, town or park" value="${esc(draft.place)}"><div class="suggest" id="placeSuggest"></div></div>
    <div class="row">
      <div class="field"><label for="fDate">Date</label><input class="input" id="fDate" type="date" value="${esc(draft.date)}" max="2099-12-31"></div>
      <div class="field"><label for="fCountry">Country</label><select class="input" id="fCountry"><option value="">—</option>${countryOpts}</select></div>
    </div>
    <div class="field"><span class="label" id="kindLbl">Kind of place</span><div class="chips" role="group" aria-labelledby="kindLbl">${KINDS.map(([k,l]) => `<button type="button" class="chip" data-kind="${k}" aria-pressed="${draft.kind===k}">${l}</button>`).join('')}</div></div>
    <div class="field"><label for="fWith">Who you were with</label><input class="input" id="fWith" placeholder="Optional" value="${esc(draft.with)}"></div>
    <div class="field"><label for="fNote">A note to remember</label><textarea class="input" id="fNote" placeholder="Optional">${esc(draft.note)}</textarea></div>
    <div class="field"><span class="label">Photo</span><div class="photo-pick"><img class="photo-thumb" id="photoThumb" alt="" hidden><label class="btn small file-label"><span id="photoLbl">Add a photo</span><input type="file" id="fPhoto" accept="image/*"></label><button type="button" class="btn small ghost" id="photoRemove" hidden>Remove</button></div></div>
    <div class="actions" style="margin-top:6px"><button class="btn" type="button" id="cancelEdit">Cancel</button><button class="btn primary" type="button" id="saveStamp">${s ? 'Save changes' : 'Stamp it'}</button></div>
  `);
  $('#fCountry').value = draft.cc || '';
  if (s && s.hasPhoto){ getPhoto(s.id).then(p => { if (p && draft && draft.id === s.id && !draft.photoChanged){ showThumb(p); } }); }
  updatePreview();
  const place = $('#fPlace'), sug = $('#placeSuggest');
  place.addEventListener('input', () => {
    draft.place = place.value;
    const m = cityByName(place.value);
    if (m) applyCity(m, false); else { draft.lat = null; draft.lon = null; draft.lm = null; draft.lmKind = null; }
    const res = searchCities(place.value);
    sug.innerHTML = res.map((c,i) => `<button type="button" data-i="${i}"><span>${esc(c.name)}</span><small>${esc(countryName(c.cc))}</small></button>`).join('');
    sug.classList.toggle('open', res.length > 0 && !(res.length === 1 && norm(res[0].name) === norm(place.value)));
    sug._res = res; updatePreview();
  });
  place.addEventListener('blur', () => setTimeout(() => sug.classList.remove('open'), 150));
  sug.addEventListener('mousedown', e => e.preventDefault());
  sug.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; const c = sug._res[+b.dataset.i]; place.value = c.name; draft.place = c.name; applyCity(c, true); sug.classList.remove('open'); updatePreview(); });
  $('#fDate').addEventListener('input', e => { if (e.target.value){ draft.date = e.target.value; updatePreview(); } });
  $('#fCountry').addEventListener('change', e => { draft.cc = e.target.value; updatePreview(); });
  $$('.chip', sheet).forEach(ch => ch.addEventListener('click', () => { draft.kind = ch.dataset.kind; draft.kindTouched = true; $$('.chip', sheet).forEach(c => c.setAttribute('aria-pressed', c === ch)); updatePreview(); }));
  $('#fWith').addEventListener('input', e => draft.with = e.target.value);
  $('#fNote').addEventListener('input', e => draft.note = e.target.value);
  $('#fPhoto').addEventListener('change', async e => { const f = e.target.files && e.target.files[0]; if (!f) return; try { const data = await shrinkImage(f); draft.photo = data; draft.photoChanged = true; showThumb(data); } catch(err){ toast('That photo couldn\'t be read. Try another one.'); } });
  $('#photoRemove').addEventListener('click', () => { draft.photo = null; draft.photoChanged = true; $('#photoThumb').hidden = true; $('#photoRemove').hidden = true; $('#photoLbl').textContent = 'Add a photo'; });

  $('#cancelEdit').addEventListener('click', closeSheet);

function showThumb(data){ const t = $('#photoThumb'); if (!t) return; t.src = data; t.hidden = false; $('#photoRemove').hidden = false; $('#photoLbl').textContent = 'Change photo'; }
function applyCity(c, setKind){
  draft.cc = c.cc; draft.lat = c.lat; draft.lon = c.lon; draft.lm = c.lm; draft.lmKind = c.kind;
  if (setKind || !draft.kindTouched){ draft.kind = c.kind; $$('.chip', sheet).forEach(ch => ch.setAttribute('aria-pressed', ch.dataset.kind === c.kind)); }
  const sel = $('#fCountry'); if (sel) sel.value = c.cc;
}
let pvRaf = 0;
function updatePreview(){
  cancelAnimationFrame(pvRaf);
  pvRaf = requestAnimationFrame(() => {
    const pv = $('#pv'); if (!pv || !draft) return;
    const s = Object.assign({}, draft, {place: draft.place.trim() || 'Your place', date: draft.date || todayISO(), id: draft.id || 'preview'});
    pv.innerHTML = stampSVG(s, null, {revisit: 1, label:false}).svg;
    pv.style.transform = `rotate(${((seedOf(s)%9)-4)}deg)`;
  });
}
function useLocation(){
  const btn = $('#locBtn');
  if (!('geolocation' in navigator)){ toast('Location isn\'t available here. Type the place instead.'); return; }
  btn.disabled = true; btn.lastChild.textContent = 'Finding you…';
  const done = () => { if (btn.isConnected){ btn.disabled = false; btn.lastChild.textContent = 'Use my location'; } };
  try {
    navigator.geolocation.getCurrentPosition(pos => {
      done();
      const {latitude:lat, longitude:lon} = pos.coords;
      const {city, dist} = nearestCity(lat, lon);
      if (!city || !draft) return;
      $('#fPlace').value = city.name; draft.place = city.name; applyCity(city, true);
      draft.lat = lat; draft.lon = lon;
      updatePreview();
      toast(dist > 60 ? `Closest place on the list is ${city.name}, ${fmtNum(dist)} km away. Edit it if that's not right.` : `Looks like you're in ${city.name}.`);
    }, () => { done(); toast('Couldn\'t get your location. Type the place instead.'); }, {enableHighAccuracy:false, timeout:12000, maximumAge:600000});
  } catch(e){ done(); toast('Location isn\'t available here. Type the place instead.'); }
}
function shrinkImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const max = 1200; let {width:w, height:h} = img; const k = Math.min(1, max/Math.max(w,h)); w = Math.round(w*k); h = Math.round(h*k); const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); try { res(c.toDataURL('image/jpeg', .8)); } catch(e){ rej(e); } };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
async function saveDraft(){
  unlockAudio();
  const place = draft.place.trim();
  if (!place){ toast('Add a place name first.'); $('#fPlace').focus(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(draft.date || '')){ toast('Pick a date for this stamp.'); return; }
  const isNew = !draft.id;
  const s = {id: draft.id || makeId(), place, cc: draft.cc || '', lat: draft.lat, lon: draft.lon, kind: draft.kind || 'city', lm: draft.lm || null, lmKind: draft.lmKind || null, date: draft.date, note: (draft.note||'').trim(), with: (draft.with||'').trim(), hasPhoto: draft.hasPhoto || false, created: draft.created || Date.now()};
  if (draft.photoChanged){ if (draft.photo){ await putPhoto(s.id, draft.photo); s.hasPhoto = true; } else { await delPhoto(s.id); s.hasPhoto = false; } }
  if (isNew) state.stamps.push(s); else state.stamps = state.stamps.map(x => x.id === s.id ? s : x);
  save();
  draft = null;
  closeSheet();
  showView('book');
  setTimeout(() => { landStamp(s.id); if (!storageOK) toast('Heads up: this browser isn\'t saving data. Add the app to your home screen.'); }, 380);
  refreshOtherViews();
}

/* ---------- Detail ---------- */
function openDetail(id){
  const s = state.stamps.find(x => x.id === id); if (!s) return;
  unlockAudio();
  const home = homeCity(); const d = km(home, s);
  const rev = revisitIndex(s), total = state.stamps.filter(x => norm(x.place) === norm(s.place)).length;
  const kindLabel = (KINDS.find(k => k[0]===s.kind)||[])[1] || 'Place';
  const facts = [
    [fmtLong(s.date), 'Date'],
    [kindLabel, 'Kind of place'],
    d != null ? [`${fmtNum(d)} km`, `From ${esc(home.name)}`] : null,
    total > 1 ? [`Visit ${rev} of ${total}`, 'Times stamped here'] : null,
    s.with ? [esc(s.with), 'With'] : null,
    s.cc ? [esc(CONT[continentOf(s.cc)] || ''), 'Continent'] : null
  ].filter(Boolean);
  openSheet(`
    <div class="detail-stamp pop" id="detailStamp">${stampSVG(s).svg}</div>
    <h2 class="detail-title" id="sheetTitle">${esc(s.place)}</h2>
    <p class="detail-sub">${esc(countryName(s.cc) || 'Somewhere wonderful')}</p>
    <div id="detailPhoto"></div>
    ${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}
    <div class="facts">${facts.map(f => `<div class="fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div>
    <button class="btn primary block" id="shareStamp" style="margin-bottom:10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>Share as image</button><div class="actions"><button class="btn" id="editStamp">Edit</button><button class="btn danger" id="delStamp">Remove</button></div>
  `);
  if (s.hasPhoto) getPhoto(s.id).then(p => { const box = $('#detailPhoto'); if (p && box) box.innerHTML = `<img class="detail-photo" src="${p}" alt="Photo from ${esc(s.place)}">`; });
  $('#editStamp').addEventListener('click', () => { closeSheet(); setTimeout(() => openEditor(s), 420); });
  $('#shareStamp').addEventListener('click', async e => { e.currentTarget.disabled = true; e.currentTarget.lastChild.textContent = 'Making your image…'; try { const c = await makeStampCard(s); openShareSheet(c, `Stamped-${s.place.replace(/[^a-z0-9]+/gi,'-')}.png`, s.place); } catch(err){ toast('Couldn\'t make the image.'); } });
  let armed = false;
  $('#delStamp').addEventListener('click', e => {
    if (!armed){ armed = true; e.currentTarget.textContent = 'Tap again to remove'; return; }
    state.stamps = state.stamps.filter(x => x.id !== s.id); delPhoto(s.id); save(); closeSheet(); renderBook(); refreshOtherViews(); toast(`Removed ${s.place}.`);
  });
}

/* ---------- Theme ---------- */
function applyTheme(key, animate=true){
  if (!THEMES[key]) key = 'classic';
  state.settings.theme = key; save();
  document.documentElement.dataset.theme = key;
  const meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue('--frame').trim() || '#0F2A5C';
  renderBook({fade: animate});
  refreshOtherViews();
}
function themeOptionsHTML(){
  const sample = stampFromCity(cityByName('Lisbon'), '2026-03-15', {id:'theme-sample'});
  return `<div class="theme-opts">${Object.entries(THEMES).map(([k,t]) => {
    const bg = k==='classic' ? '#F3F6FB' : k==='vintage' ? '#F1E6D2' : '#12213F';
    return `<button class="theme-opt" data-theme-opt="${k}" aria-pressed="${state.settings.theme===k}"><span class="sw" style="background:${bg}">${stampSVG(sample, k, {revisit:1, label:false}).svg}</span><b>${t.label}</b></button>`; }).join('')}</div>`;
}
function bindThemeOptions(root){ $$('[data-theme-opt]', root).forEach(b => b.addEventListener('click', () => { applyTheme(b.dataset.themeOpt); $$('[data-theme-opt]', root).forEach(x => x.setAttribute('aria-pressed', x === b)); buzz(10); })); }
$('#cloudBtn').addEventListener('click', backupToICloud);

/* ---------- Views ---------- */
let currentView = 'book';
function showView(v){
  currentView = v;
  document.documentElement.classList.toggle('book-mode', v === 'book');
  $$('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
  if (v === 'year') renderYear(); else if (v === 'stats') renderStats(); else if (v === 'settings') renderSettings();
  window.scrollTo({top:0, behavior:'smooth'});
}
$$('.tab').forEach(t => t.addEventListener('click', () => showView(t.dataset.view)));
$('#addBtn').addEventListener('click', () => openEditor());
function refreshOtherViews(){ if (currentView === 'year') renderYear(); else if (currentView === 'stats') renderStats(); else if (currentView === 'settings') renderSettings(); }
function countUp(root){
  $$('[data-count]', root).forEach(el => {
    const end = +el.dataset.count, suffix = el.dataset.suffix || '', t0 = performance.now(), dur = 1000;
    const step = t => { const p = Math.min(1, (t - t0)/dur), e = 1 - Math.pow(1-p, 3); el.textContent = fmtNum(end*e) + suffix; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function flagHTML(cc){ const c = countryCols(cc); return c.length ? `<span class="flag" aria-hidden="true">${c.map(x => `<i style="background:${x}"></i>`).join('')}</span>` : `<span class="flag" aria-hidden="true"><i style="background:var(--surface-2)"></i></span>`; }
function emptyCard(title, text){ return `<div class="card hero"><div class="eyebrow">${title}</div><p style="margin-top:10px">${text}</p><button class="btn primary" data-go-add>Add a stamp</button> <button class="btn ghost small" data-go-sample>Load sample trips</button></div>`; }
function bindEmpty(root){ const a = $('[data-go-add]', root); if (a) a.addEventListener('click', () => openEditor()); const b = $('[data-go-sample]', root); if (b) b.addEventListener('click', loadSamples); }

/* Year in review */
let selYear = null;
function renderYear(){
  const root = $('#view-year'); const list = sorted();
  const years = [...new Set(list.map(s => parts(s.date).y))].sort((a,b) => b-a);
  if (!years.length){ root.innerHTML = `<div class="book-meta"><div><div class="eyebrow">Year in review</div><h1 class="h1">Your year, in stamps</h1></div></div>` + emptyCard('Nothing here yet', 'Once you have a few stamps, your year comes together here with a replay you can watch.'); bindEmpty(root); return; }
  if (!years.includes(selYear)) selYear = years[0];
  const ys = list.filter(s => parts(s.date).y === selYear);
  const before = list.filter(s => parts(s.date).y < selYear);
  const prevCountries = new Set(before.map(s => s.cc).filter(Boolean));
  const st = computeStats(ys);
  const newC = [...st.countries].filter(c => !prevCountries.has(c));
  const busiest = st.months.indexOf(Math.max(...st.months));
  const maxM = Math.max(1, ...st.months);
  const topCountry = Object.entries(st.countryCounts).sort((a,b) => b[1]-a[1])[0];
  const sentence = `${st.n} ${st.n===1?'stamp':'stamps'} across ${st.countries.size} ${st.countries.size===1?'country':'countries'}${newC.length ? `, ${newC.length} of them new to you` : ''}.${st.farPlace ? ` Farthest from home: ${esc(st.farPlace.place)}.` : ''}`;
  root.innerHTML = `
    <div class="book-meta"><div><div class="eyebrow">Year in review</div><h1 class="h1">Your year, in stamps</h1></div></div>
    <div class="year-chips" role="group" aria-label="Choose a year">${years.map(y => `<button class="ychip" data-y="${y}" aria-pressed="${y===selYear}">${y}</button>`).join('')}</div>
    <div class="stack">
      <div class="card hero"><div class="eyebrow">${selYear} in review</div><div class="big" data-count="${st.n}">0</div><p>${sentence}</p><button class="btn primary" id="playReplay"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Replay my year</button> <button class="btn" id="shareYear">Share</button></div>
      <div class="tiles">
        <div class="tile" style="--i:0"><div class="num" data-count="${st.countries.size}">0</div><div class="lbl">Countries</div></div>
        <div class="tile" style="--i:1"><div class="num" data-count="${newC.length}">0</div><div class="lbl">New countries</div></div>
        <div class="tile" style="--i:2"><div class="num" data-count="${st.places.size}">0</div><div class="lbl">Places</div></div>
        <div class="tile" style="--i:3"><div class="num" data-count="${Math.round(st.farKm)}" data-suffix=" km">0</div><div class="lbl">Farthest from home</div>${st.farPlace ? `<div class="sub">${esc(st.farPlace.place)}</div>` : ''}</div>
      </div>
      <div class="card"><h3>Month by month</h3><div class="months">${st.months.map((n,i) => `<div class="mcol"><div class="bar ${n && i===busiest ? 'hot' : n ? 'has' : ''}" style="--i:${i};height:${n ? Math.max(12, n/maxM*100) : 4}%" title="${MONTH_LONG[i]}: ${n}"></div><div class="mlabel">${MONTH_LONG[i][0]}</div></div>`).join('')}</div><p class="help" style="margin:12px 0 0">Busiest month: <b>${MONTH_LONG[busiest]}</b> with ${st.months[busiest]} ${st.months[busiest]===1?'stamp':'stamps'}.</p></div>
      ${newC.length ? `<div class="card"><h3>New countries</h3>${newC.map(c => `<div class="list-row">${flagHTML(c)}<div class="grow"><b>${esc(countryName(c))}</b><small>First stamp: ${esc(ys.find(s => s.cc === c).place)}</small></div></div>`).join('')}</div>` : ''}
      <div class="card"><h3>Highlights</h3>
        <div class="list-row"><div class="grow"><b>${esc(st.first.place)}</b><small>First stamp of the year · ${fmtLong(st.first.date)}</small></div></div>
        <div class="list-row"><div class="grow"><b>${esc(st.last.place)}</b><small>Latest stamp · ${fmtLong(st.last.date)}</small></div></div>
        ${topCountry ? `<div class="list-row">${flagHTML(topCountry[0])}<div class="grow"><b>${esc(countryName(topCountry[0]))}</b><small>Most-stamped country</small></div><span class="count-pill">${topCountry[1]}</span></div>` : ''}
      </div>
      <div class="card"><h3>Every stamp</h3><div class="minis">${ys.map(s => `<button class="mini" data-id="${s.id}" aria-label="${esc(s.place)}">${stampSVG(s, null, {label:false}).svg}</button>`).join('')}</div></div>
    </div>`;
  $$('.ychip', root).forEach(b => b.addEventListener('click', () => { selYear = +b.dataset.y; renderYear(); }));
  $$('.mini', root).forEach(b => b.addEventListener('click', () => openDetail(b.dataset.id)));
  $('#playReplay').addEventListener('click', () => playReplay(selYear));
  $('#shareYear').addEventListener('click', async e => { const btn = e.currentTarget; btn.disabled = true; btn.textContent = 'Making…'; try { const c = await makeYearCard(selYear); openShareSheet(c, `Stamped-${selYear}.png`, `${selYear} in stamps`); } catch(err){ toast('Couldn\'t make the image.'); } btn.disabled = false; btn.textContent = 'Share'; });
  countUp(root);
}
let replayTimers = [];
function playReplay(year){
  unlockAudio();
  const ys = sorted().filter(s => parts(s.date).y === year);
  if (!ys.length) return;
  const st = computeStats(ys);
  const prev = new Set(sorted().filter(s => parts(s.date).y < year).map(s => s.cc).filter(Boolean));
  const newC = [...st.countries].filter(c => !prev.has(c)).length;
  const R = $('#replay');
  const show = ys.slice(0, 15);
  R.innerHTML = `<div class="replay-head"><div class="eyebrow">Year in stamps</div><div class="replay-year">${year}</div><div class="replay-month" id="rMonth"> </div></div>
    <div class="replay-grid" id="rGrid"></div>
    <div class="replay-sum" id="rSum"><b>That was ${year}.</b>${st.n} ${st.n===1?'stamp':'stamps'} · ${st.countries.size} ${st.countries.size===1?'country':'countries'}${newC ? ` · ${newC} new` : ''}${ys.length > show.length ? `<br><small>Showing the first ${show.length}.</small>` : ''}</div>
    <div class="replay-actions"><button class="btn" id="rSkip">Skip</button><button class="btn primary" id="rClose">Close</button></div>`;
  R.classList.add('open');
  const grid = $('#rGrid'), month = $('#rMonth');
  const gap = Math.max(380, Math.min(900, 7000 / show.length));
  replayTimers.forEach(clearTimeout); replayTimers = [];
  show.forEach((s, i) => {
    replayTimers.push(setTimeout(() => {
      const {svg, ink} = stampSVG(s, null, {label:false});
      const r = rng(seedOf(s)); const rot = ((r()-.5)*24).toFixed(1);
      const cell = document.createElement('div'); cell.className = 'rs';
      cell.innerHTML = `<div class="stamp landing" style="--x:50%;--y:50%;--rot:${rot}deg;color:${ink}">${svg}</div>`;
      grid.appendChild(cell);
      month.style.opacity = 0; setTimeout(() => { month.textContent = `${MONTH_LONG[parts(s.date).m-1]} · ${s.place}`; month.style.opacity = 1; }, 150);
      setTimeout(() => { thunk(.6); buzz(12); }, 380);
    }, 500 + i*gap));
  });
  replayTimers.push(setTimeout(() => { $('#rSum').classList.add('show'); month.style.opacity = 0; }, 900 + show.length*gap));
  const close = () => { replayTimers.forEach(clearTimeout); R.classList.remove('open'); };
  $('#rClose').addEventListener('click', close);
  $('#rSkip').addEventListener('click', e => {
    replayTimers.forEach(clearTimeout); replayTimers = [];

/* ---------- Backup / iCloud ---------- */
async function buildBackup(){
  const photos = {};
  for (const s of state.stamps){ if (s.hasPhoto){ const p = await getPhoto(s.id); if (p) photos[s.id] = p; } }
  return JSON.stringify({app:'stamped', version:1, exported:new Date().toISOString(), settings:state.settings, stamps:state.stamps, photos});
}
function markBackedUp(){ state.settings.lastBackup = Date.now(); state.settings.stampsAtBackup = state.stamps.length; save(); renderNudge(); if (currentView === 'settings') renderSettings(); }
async function backupToICloud(){
  const txt = backupCache || await buildBackup();
  const name = `Stamped-backup-${todayISO()}.json`;
  let file = null; try { file = new File([txt], name, {type:'application/json'}); } catch(e){}
  if (file && navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:'Stamped backup'}); markBackedUp(); toast('Saved. Your book is backed up.'); return; }
    catch(e){ if (e && e.name === 'AbortError') return; }
  }
  if (window.claude && typeof window.claude.use === 'function'){
    let dl = null; try { dl = await window.claude.use('downloads'); } catch(e){}
    if (dl){ try { await dl.save({filename:name, data:txt}); markBackedUp(); toast('Backup saved. Move it into iCloud Drive in the Files app.'); } catch(e){ toast('Backup wasn\'t saved. Try "Copy backup text" instead.'); } return; }
  }
  try {
    const url = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    markBackedUp(); toast('Backup file saved. Move it into iCloud Drive in the Files app.');
  } catch(e){ toast('Saving files isn\'t allowed here. Use "Copy backup text" instead.'); }
}
async function restoreBackup(text){
  const data = JSON.parse(text);
  if (!data || data.app !== 'stamped' || !Array.isArray(data.stamps)) throw new Error('not a backup');
  const byId = new Map(state.stamps.map(s => [s.id, s]));
  let added = 0;
  for (const s of data.stamps){ if (!s || !s.id || !s.place || !s.date) continue; if (!byId.has(s.id)) added++; byId.set(s.id, s); }
  state.stamps = [...byId.values()];
  if (data.settings) state.settings = Object.assign({}, state.settings, {name: data.settings.name ?? state.settings.name, home: data.settings.home || state.settings.home});
  for (const [id, p] of Object.entries(data.photos || {})) await putPhoto(id, p);
  state.settings.stampsAtBackup = state.stamps.length; save();
  renderBook(); refreshOtherViews();
  toast(added ? `Restored ${added} ${added===1?'stamp':'stamps'}.` : 'Backup restored — everything was already here.');
}

/* ---------- Share images ---------- */
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const FILTER_DEFS = (document.querySelector('body > svg defs') || {}).innerHTML || '';
function exportSVG(svg, size){

  s = s.replace(/(<svg[^>]*>)/, `$1<defs>${FILTER_DEFS}</defs>`);
  return s.replace(/<textPath href="(#[^"]+)"/g, '<textPath href="$1" xlink:href="$1"');

function loadSVGImage(svg, size){ return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(exportSVG(svg, size)); }); }

function monoFontCss(){ const t = state.settings.theme; return t==='vintage' ? '"Special Elite", "Courier New", monospace' : t==='night' ? '"DM Mono", Menlo, monospace' : '"Courier Prime", "Courier New", monospace'; }
const headWeight = () => state.settings.theme === 'vintage' ? '400' : '700';
async function ensureFonts(){ try { await Promise.all([document.fonts.load(`${headWeight()} 80px ${headFont()}`), document.fonts.load(`400 30px ${monoFontCss()}`), document.fonts.load('500 30px Inter')]); } catch(e){} }

async function makeStampCard(s){

  const show = ys.slice(0, 9), cols = 3, cell = 300, rows = Math.ceil(show.length / cols);
  const gx = px + (pw - cols*cell)/2, gy = py + (ph - rows*cell)/2 - (ys.length > 9 ? 16 : 0);
  const imgs = await Promise.all(show.map(s => loadSVGImage(stampSVG(s, null, {label:false}).svg, 300)));
  imgs.forEach((img, i) => { const s = show[i], r = rng(seedOf(s)); const cx = gx + (i % cols)*cell + cell/2, cy = gy + Math.floor(i/cols)*cell + cell/2; ctx.save(); ctx.translate(cx, cy); ctx.rotate(((r()-.5)*22) * Math.PI/180); ctx.drawImage(img, -140, -140, 280, 280); ctx.restore(); });
  if (ys.length > 9){ ctx.textAlign = 'center'; ctx.fillStyle = cssVar('--muted'); ctx.font = `400 30px ${monoFontCss()}`; ctx.fillText(`+ ${ys.length - 9} more`, 540, py + ph - 30); }
  drawBrand(ctx, 90, 1272, cssVar('--eyebrow'), 'left');
  if (st.farPlace){ ctx.textAlign = 'right'; ctx.fillStyle = cssVar('--frame-muted'); ctx.font = `400 28px ${monoFontCss()}`; ctx.fillText(`Farthest: ${st.farPlace.place}`, 990, 1268); }
  return c;
}
function openShareSheet(canvas, filename, label){
  canvas.toBlob(blob => {
    if (!blob){ toast('Couldn\'t make the image.'); return; }
    const url = URL.createObjectURL(blob);
    let file = null; try { file = new File([blob], filename, {type:'image/png'}); } catch(e){}
    openSheet(`<h2 id="sheetTitle">${esc(label)}</h2><p class="sheet-sub">Share it to Messages or Instagram, or save it to Photos. You can also press and hold the image.</p><img class="share-img" src="${url}" alt="Share image for ${esc(label)}"><div class="actions"><button class="btn" id="shareClose">Close</button><button class="btn primary" id="shareGo">Share image</button></div>`, () => setTimeout(() => URL.revokeObjectURL(url), 1500));
    $('#shareClose').addEventListener('click', closeSheet);
    $('#shareGo').addEventListener('click', async () => {
      if (file && navigator.canShare && navigator.canShare({files:[file]})){ try { await navigator.share({files:[file]}); return; } catch(e){ if (e && e.name === 'AbortError') return; } }
      if (window.claude && typeof window.claude.use === 'function'){ let dl = null; try { dl = await window.claude.use('downloads'); } catch(e){} if (dl){ try { await dl.save({filename, data:blob}); toast('Image saved.'); } catch(e){ toast('The image wasn\'t saved. Press and hold it instead.'); } return; } }
      try { const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); toast('Image saved.'); } catch(e){ toast('Press and hold the image to save it.'); }
    });
  }, 'image/png');
}

/* ---------- Samples ---------- */
function loadSamples(){
  const rows = [['Montreal','2024-06-14',''],['Quebec City','2024-06-16','Walked the old city walls at sunset.'],['Niagara Falls','2024-08-03',''],['New York','2024-12-07','Christmas windows and way too much walking.'],['Cancún','2025-02-15',''],['Banff','2025-07-09','Lake Louise at sunrise.'],['Vancouver','2025-07-13',''],['Paris','2025-10-04',''],['Pisa','2025-10-08','The obligatory tower-holding photo.'],['Rome','2025-10-10',''],['Lisbon','2026-03-15','Rode the 28 tram twice.'],['Sintra','2026-03-17',''],['Porto','2026-03-19',''],['Halifax','2026-08-21','']];
  const have = new Set(state.stamps.map(s => norm(s.place) + s.date));
  let n = 0; rows.forEach(([p,d,note], i) => { if (have.has(norm(p)+d)) return; const c = cityByName(p); if (!c) return; state.stamps.push(stampFromCity(c, d, {note, created: Date.now()+i})); n++; });
  save(); page = 0; renderBook(); refreshOtherViews();
  if (sheet.classList.contains('open')) closeSheet();
  showView('book'); setTimeout(() => goPage(1), 300);
  toast(n ? `Added ${n} sample trips. Swipe through your book.` : 'Sample trips are already in your book.');
}

scheduleBackupCache();
document.documentElement.dataset.theme = THEMES[state.settings.theme] ? state.settings.theme : 'classic';
applyTheme(document.documentElement.dataset.theme, false);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderBook());
